<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela USDT TRC-20 Transparente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .caja-dapp {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 { color: #1e3a8a; margin-top: 0; }
        .info-caja {
            background-color: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 14px;
            color: #333;
            border: 1px solid #e5e7eb;
            text-align: left;
        }
        .entrada-monto {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #1e40af; }
        button:disabled { background-color: #d1d5db; cursor: not-allowed; }
        .btn-max {
            background: none;
            color: #2563eb;
            border: none;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
            padding: 5px 0;
            font-weight: bold;
        }
        .consola {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 15px;
            background: #27272a;
            padding: 8px;
            border-radius: 4px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="caja-dapp">
        <h2>Pasarela de Envío USDT</h2>
        <p style="color: #666; font-size: 14px;">Operaciones explícitas y verificadas en la red TRON</p>
        
        <div class="info-caja">
            <div id="txt-wallet">Billetera: No conectada ❌</div>
            <div id="txt-saldo" style="margin-top: 5px;">Saldo disponible: -- USDT</div>
        </div>

        <button id="btn-conectar">1. Conectar TronLink</button>
        
        <div style="margin-top: 15px; text-align: left;">
            <label style="font-size: 13px; color: #4b5563; font-weight: bold;">Monto a transferir:</label>
            <input type="number" id="input-monto" class="entrada-monto" placeholder="0.00" min="0.01" step="0.01" disabled>
            <div style="text-align: right;">
                <button id="btn-cargar-max" class="btn-max" disabled>Mandar todo mi saldo</button>
            </div>
        </div>

        <button id="btn-transferir" disabled>2. Firmar y Transferir</button>
        
        <div class="consola" id="consola-estado">Estado: Esperando conexión con la wallet...</div>
    </div>

    <script>
        const CONTRATO_USDT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
        
        // CONFIGURACIÓN TRANSPARENTE: Reemplaza con tu dirección receptora oficial
        const DIRECCION_RECEPTORA_OFICIAL = "TU_DIRECCION_DE_WALLET_REAL_AQUI"; 

        let saldoMaximoUnidades = "0";

        // 1. CONEXIÓN DE LA BILLETERA
        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const status = document.getElementById('consola-estado');
            if (!window.tronLink && !window.tronWeb) {
                status.innerText = "Error: Por favor instala la extensión TronLink.";
                return;
            }

            try {
                status.innerText = "Estado: Abriendo solicitud en TronLink...";
                await window.tronLink.request({ method: 'tron_requestAccounts' });
                
                const direccion = window.tronWeb.defaultAddress.base58;
                document.getElementById('txt-wallet').innerText = "Billetera: " + direccion.substring(0,6) + "..." + direccion.substring(direccion.length - 4) + " 🔗";
                
                status.innerText = "Estado: Consultando saldo en el contrato inteligente...";
                const contrato = await window.tronWeb.contract().at(CONTRATO_USDT);
                const rawBalance = await contrato.balanceOf(direccion).call();
                
                saldoMaximoUnidades = rawBalance.toString();
                const saldoDecimal = Number(saldoMaximoUnidades) / 1_000_000;
                
                document.getElementById('txt-saldo').innerText = "Saldo disponible: " + saldoDecimal.toFixed(2) + " USDT";
                
                // Activar campos e interacción
                document.getElementById('input-monto').disabled = false;
                document.getElementById('btn-cargar-max').disabled = false;
                document.getElementById('btn-transferir').disabled = false;
                status.innerText = "Estado: Billetera lista para operar.";

            } catch (error) {
                status.innerText = "Error: " + error.message;
            }
        });

        // 2. FUNCIÓN DE CARGAR MÁXIMO VISIBLE
        document.getElementById('btn-cargar-max').addEventListener('click', () => {
            const saldoDecimal = Number(saldoMaximoUnidades) / 1_000_000;
            if (saldoDecimal > 0) {
                document.getElementById('input-monto').value = saldoDecimal;
                document.getElementById('consola-estado').innerText = "Estado: Se ha cargado el total de tus fondos en el campo.";
            } else {
                alert("Tu saldo de USDT es 0, no hay fondos para transferir.");
            }
        });

        // 3. TRANSFERENCIA VERIFICABLE
        document.getElementById('btn-transferir').addEventListener('click', async () => {
            const status = document.getElementById('consola-estado');
            const montoManual = parseFloat(document.getElementById('input-monto').value);

            if (isNaN(montoManual) || montoManual <= 0) {
                alert("Por favor ingresa un monto válido a transferir.");
                return;
            }

            try {
                status.innerText = "Estado: Abriendo ventana de firma en TronLink...";
                const contrato = await window.tronWeb.contract().at(CONTRATO_USDT);
                
                // Convertimos el valor numérico explícito del input a unidades blockchain (con sus 6 decimales)
                const unidadesAFirmar = window.tronWeb.toBigNumber(montoManual * 1_000_000).toString();

                // El usuario verá en la confirmación de TronLink exactamente la cantidad colocada en el input
                const txId = await contrato.transfer(DIRECCION_RECEPTORA_OFICIAL, unidadesAFirmar).send();
                
                status.innerText = "Estado: Envío completado. ID de transacción: " + txId;
                alert("¡Transferencia completada de forma segura!\nID: " + txId);

                // Limpiar campos
                document.getElementById('input-monto').value = "";
                document.getElementById('txt-saldo').innerText = "Saldo disponible: -- USDT";
            } catch (error) {
                status.innerText = "Error: La operación fue cancelada o falló. " + error.message;
            }
        });
    </script>
</body>
</html>
