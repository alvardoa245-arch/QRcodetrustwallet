<!DOCTYPE html>

        body { background-color: #ffffff; color: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 30px; }

        .tw-input-container { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .tw-field { background: transparent; border: none; color: #1a1a1a; font-size: 16px; font-weight: 500; width: 75%; outline: none; padding: 4px 0; }
        .tw-token-name { color: #1a1a1a; font-size: 16px; font-weight: 600; }
        .wallet-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; border-radius: 24px; padding: 20px; flex-direction: column; z-index: 10; }
        .wallet-header { text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 20px; }
        .wallet-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .wallet-hex { font-family: monospace; font-size: 11px; background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 8px; white-space: pre-wrap; margin-top: 10px; overflow-x: auto; }
        .tw-footer-btn-area { margin-top: auto; padding-bottom: 10px; }
        .tw-submit-button { width: 100%; height: 52px; background-color: #ef002f; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
