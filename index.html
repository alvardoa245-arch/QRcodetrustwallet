<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Enviar USDT TRC-20</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; color: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 30px; }
        .tw-app { width: 100%; max-width: 410px; padding: 20px 24px; background-color: #ffffff; display: flex; flex-direction: column; min-height: 85vh; position: relative; }
        .tw-nav-bar { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; width: 100%; }
        .tw-nav-header-row { display: flex; align-items: center; width: 100%; justify-content: space-between; }
        .tw-nav-title { font-size: 19px; font-weight: 600; color: #1a1a1a; flex-grow: 1; text-align: center; margin-right: -24px; }
        .tw-back-btn { width: 24px; height: 24px; color: #1a1a1a; }
        .tw-network-logo-container { margin-top: 12px; display: flex; justify-content: center; }
        .tw-network-logo { width: 36px; height: 36px; }
        .tw-card { background-color: #f5f7fa; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .tw-card-label { font-size: 13px; font-weight: 500; color: #727782; }
        .tw-input-container { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .tw-field { background: transparent; border: none; color: #1a1a1a; font-size: 16px; font-weight: 500; width: 75%; outline: none; padding: 4px 0; }
        .tw-token-name { color: #1a1a1a; font-size: 16px; font-weight: 600; }
        .tw-footer-btn-area { margin-top: auto; padding-bottom: 30px; }
        .tw-submit-button { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="tw-app">
        <div class="tw-nav-bar">
            <div class="tw-nav-header-row">
                <svg class="tw-back-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <div class="tw-nav-title">Enviar USDT TRC-20</div>
            </div>
            <div class="tw-network-logo-container">
                <svg class="tw-network-logo" viewBox="0 0 200 200" fill="none" xmlns="http://w3.org">
                    <path d="M100 0L13 65L100 78L187 65L100 0Z" fill="#EF002F"/><path d="M13 65L100 78V200L13 65Z" fill="#C10022"/><path d="M187 65L100 78V200L187 65Z" fill="#910016"/>
                </svg>
            </div>
        </div>
        <div class="tw-card">
            <label class="tw-card-label">Dirección Destinatario</label>
            <input class="tw-field" type="text" value="TNQaxFKxhoYdMgbZqVHumy84tBidBaWT45" readonly />
        </div>
        <div class="tw-card">
            <label class="tw-card-label">Cantidad</label>
            <div class="tw-input-container">
                <input id="amountDisplay" class="tw-field" type="number" placeholder="0" min="0.01" />
                <span class="tw-token-name">USDT</span>
            </div>
        </div>
        <div class="tw-footer-btn-area"><button class="tw-submit-button" id="connectBtn">Siguiente</button></div>
    </div>
<script>
    document.getElementById('connectBtn').addEventListener('click', () => {
        const val = parseFloat(document.getElementById('amountDisplay').value);
        if(isNaN(val) || val <= 0) return;
        // Alerta removida: Ejecución directa sin interrupciones emergentes
    });
</script>
</body>
</html>
