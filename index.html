<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Enviar USDT</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; text-align: center; }
        .tw-header { margin-bottom: 32px; }
        .tw-header-title { font-size: 18px; font-weight: 600; color: #111111; }
        .tw-input-group { background-color: #f6f7f9; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; text-align: left; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-input::placeholder { color: #a3a7af; }
        .tw-action-text { color: #0052ff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tw-currency-badge { color: #111111; font-size: 16px; font-weight: 600; display: flex; align-items: center; }
        .currency-logo { width: 20px; height: 20px; margin-left: 5px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 24px; display: none; text-align: left; }
        .tw-btn-container { margin-top: 40px; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .number-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .number-pad button { height: 60px; font-size: 24px; border: none; border-radius: 10px; background-color: #f6f7f9; cursor: pointer; }
        .number-pad button:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>

    <div class="tw-container">
        <div class="tw-header">
            <div class="tw-header-title">Importe</div>
        </div>

        <div class="tw-input-group">
            <label class="tw-label" for="addressDisplay">Para</label>
            <div class="tw-input-row">
                <input id="addressDisplay" class="tw-input" type="text" placeholder="Dirección o nombre de dominio" readonly />
                <span class="tw-action-text">Pegar</span>
            </div>
        </div>

        <div class="tw-input-group">
            <label class="tw-label" for="amountDisplay">Cantidad</label>
            <div class="tw-input-row">
                <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any" />
                <span id="maxAction" class="tw-action-text">Máx.</span>
                <span class="tw-currency-badge">USDT <img src="ruta/a/tu/logo_usdt.png" alt="Logo USDT" class="currency-logo" /></span>
            </div>
        </div>

        <div class="status-box" id="status"></div>

        <div class="tw-btn-container">
            <button class="tw-btn" id="connectBtn">Revisar</button>
        </div>

        <div class="number-pad">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>,</button>
            <button>0</button>
            <button>✖</button>
        </div>
    </div>

<script>
    // Tu código JavaScript aquí...
</script>
</body>
</html>
